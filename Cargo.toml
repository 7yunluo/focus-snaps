[package]
name = "focus-snaps"
version = "0.3.6"
edition = "2021"

[[bin]]
name = "FocusSnapS"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11" }
gtk4-layer-shell = "0.8"
pangocairo = "0.22"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rustix = { version = "1", features = ["fs", "mm"] }
serde_json = "1"

[profile.release]
opt-level = 2
