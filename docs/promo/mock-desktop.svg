<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="1600" viewBox="0 0 3840 1600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a2c"/>
      <stop offset="0.55" stop-color="#1b1a24"/>
      <stop offset="1" stop-color="#2a1a20"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.28" r="0.7">
      <stop offset="0" stop-color="#ffb88c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffb88c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="3840" height="1600" fill="url(#bg)"/>
  <rect width="3840" height="1600" fill="url(#glow)"/>

  <!-- 窗口 A：编辑器，只留几行 -->
  <g filter="url(#shadow)">
    <rect x="240" y="200" width="1700" height="1200" rx="18" fill="#15171d"/>
    <rect x="240" y="200" width="1700" height="86" rx="18" fill="#1d2029"/>
    <rect x="240" y="268" width="1700" height="18" fill="#1d2029"/>
    <circle cx="292" cy="243" r="12" fill="#ff5f57"/>
    <circle cx="332" cy="243" r="12" fill="#febc2e"/>
    <circle cx="372" cy="243" r="12" fill="#28c840"/>
    <rect x="240" y="286" width="110" height="1114" fill="#12141a"/>

    <!-- 顶部几行 -->
    <g fill="#3a4150">
      <rect x="380" y="340" width="110" height="20" rx="10"/>
      <rect x="510" y="340" width="170" height="20" rx="10"/>
      <rect x="380" y="392" width="250" height="20" rx="10"/>
    </g>
    <g fill="#9299ab"><rect x="380" y="444" width="380" height="20" rx="10"/></g>
    <g fill="#3a4150"><rect x="380" y="496" width="180" height="20" rx="10"/></g>

    <!-- 待修改的一小段 -->
    <g fill="#2f3543">
      <rect x="420" y="600" width="300" height="20" rx="10"/>
      <rect x="420" y="652" width="240" height="20" rx="10"/>
      <rect x="420" y="704" width="360" height="20" rx="10"/>
    </g>
  </g>

  <!-- 窗口 B：列表面板，保持留白 -->
  <g filter="url(#shadow)">
    <rect x="2060" y="320" width="1480" height="1000" rx="18" fill="#191b21"/>
    <rect x="2060" y="320" width="380" height="1000" rx="18" fill="#12141a"/>
    <rect x="2422" y="320" width="18" height="1000" fill="#12141a"/>
    <g fill="#2a2e39">
      <rect x="2100" y="380" width="180" height="22" rx="11"/>
      <rect x="2100" y="446" width="280" height="18" rx="9"/>
      <rect x="2100" y="494" width="240" height="18" rx="9"/>
      <rect x="2100" y="542" width="300" height="18" rx="9"/>
    </g>
    <circle cx="2560" cy="420" r="34" fill="#3a4050"/>
    <g fill="#2a2e39">
      <rect x="2620" y="398" width="220" height="20" rx="10"/>
      <rect x="2620" y="438" width="420" height="16" rx="8"/>
      <rect x="2560" y="700" width="260" height="20" rx="10"/>
      <rect x="2560" y="746" width="520" height="16" rx="8"/>
      <rect x="2560" y="782" width="380" height="16" rx="8"/>
    </g>
    <rect x="2560" y="900" width="620" height="200" rx="14" fill="#20242e"/>
